<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>

    <div class="theme-toggle">
      <span class="toggle-icon">☀</span>
      <label class="switch">
        <input type="checkbox" id="theme-switch" />
        <span class="slider"></span>
      </label>
      <span class="toggle-icon">🌙</span>
    </div>

    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>
        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">0</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <!-- Overlay pausa / game over -->
    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <!-- Campo de nombre: visible cuando se entra al top 5 -->
        <div id="name-entry" class="name-entry hidden">
          <p class="name-entry-label">¡Entraste al top 5! Escribe tu nombre:</p>
          <input type="text" id="player-name" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
          <button id="save-score-btn">Guardar</button>
        </div>

        <!-- Tabla de records en pantalla de game over -->
        <div id="gameover-scores" class="scores-section hidden">
          <p class="scores-title">MEJORES PUNTUACIONES</p>
          <table id="gameover-table" class="scores-table"></table>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <!-- Pantalla de inicio: se muestra al cargar, antes de Jugar -->
    <div id="start-overlay" class="overlay">
      <div class="overlay-box start-box">
        <p class="start-title">TETRIS</p>

        <!-- Estadísticas históricas globales -->
        <div class="global-stats">
          <span>Mejor combo: <strong id="stat-best-combo">-</strong></span>
          <span>Máx. líneas: <strong id="stat-max-lines">-</strong></span>
        </div>

        <!-- Tabla de records en pantalla de inicio -->
        <p class="scores-title">MEJORES PUNTUACIONES</p>
        <table id="start-table" class="scores-table"></table>

        <div class="start-buttons">
          <button id="play-btn">Jugar</button>
          <button id="reset-records-btn" class="btn-secondary">Resetear records</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
